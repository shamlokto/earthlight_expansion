<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earth Light Expansion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* the intermission: a carrier's hangar deck between battles (css/game.css has the shared look) */
    html, body { height: auto; }
    body { display: block; }
    main { max-width: 1120px; margin: 0 auto; padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
    #status { font-family: var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); }
    .box { padding: 18px 20px; animation: rise .5s var(--ease) both; }
    .box:nth-of-type(2) { animation-delay: .06s; } .box:nth-of-type(3) { animation-delay: .12s; } .two { animation: rise .5s var(--ease) .1s both; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
    .box h2 { margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--cyan); display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .box h2 small { font-family: var(--f-body); letter-spacing: 0; text-transform: none; font-weight: 400; font-size: 13px; color: var(--dim); }
    .muted { color: var(--dim); font-size: 14px; margin: 0 0 10px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    canvas { image-rendering: pixelated; }

    /* hero: the next mission */
    .hero { --br: var(--gold); --bl: 26px; position: relative; overflow: hidden; padding: 28px 30px 26px; border-color: rgba(245, 197, 66, .3); }
    .hero::before { content: ""; position: absolute; inset: auto -10% -60% -10%; height: 120%; background: radial-gradient(60% 50% at 50% 100%, rgba(var(--earth), .35), transparent 70%); pointer-events: none; }
    .heroNum { position: absolute; right: 18px; top: -18px; font: 700 clamp(110px, 18vw, 200px)/1 var(--f-display); color: transparent; -webkit-text-stroke: 1px rgba(245, 197, 66, .28); letter-spacing: -.02em; pointer-events: none; }
    .eyebrow { font: 600 12px var(--f-display); letter-spacing: .3em; text-transform: uppercase; color: var(--cyan); }
    .hero h1 { position: relative; margin: 6px 0 14px; font-size: clamp(30px, 5.4vw, 52px); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; line-height: 1.05;
      background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 20px rgba(245, 197, 66, .25)); text-wrap: balance; }
    .brief { position: relative; white-space: pre-wrap; max-width: 70ch; font-size: 16px; line-height: 1.7; margin: 0 0 14px; padding-left: 16px; border-left: 2px solid var(--cyan); }
    .chips { position: relative; display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { font: 600 12px var(--f-display); letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; border: 1px solid var(--edge); background: rgba(111, 211, 255, .06); color: var(--ink); clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
    .chip.cyan { color: var(--cyan); } .chip.gold { color: var(--gold); border-color: rgba(245, 197, 66, .5); }
    .launchrow { position: relative; margin-top: 18px; }
    .btn.big { font-size: 17px; padding: 14px 30px; letter-spacing: .18em; }

    /* status bar */
    .hudbar { display: flex; flex-wrap: wrap; gap: 1px; background: var(--edge); border: 1px solid var(--edge); }
    .hudbar span { flex: 1 1 140px; display: flex; align-items: baseline; gap: 10px; padding: 10px 16px; background: rgba(8, 14, 46, .88); }
    .hudbar em { font: 600 11px var(--f-display); font-style: normal; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
    .hudbar b { font: 600 22px var(--f-data); color: var(--ink); }
    .hudbar .beta { font: 700 10px var(--f-display); font-style: normal; letter-spacing: .14em; text-transform: uppercase; color: #1d1300; background: var(--gold); padding: 1px 6px; }

    /* roster: one card per machine */
    .roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: 12px; }
    .rcard { --tint: var(--edge); position: relative; display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 10px 12px; padding: 12px; border: 1px solid var(--tint);
      background: linear-gradient(160deg, rgba(111, 211, 255, .08), rgba(8, 14, 46, .7) 60%); transition: border-color .2s, box-shadow .2s, transform .2s var(--ease); }
    .rcard:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }
    .rcard.on { --tint: rgba(255, 143, 216, .7); box-shadow: inset 0 0 30px rgba(255, 143, 216, .1); }
    .rcard.gen { --tint: var(--gold); box-shadow: 0 0 24px rgba(245, 197, 66, .25), inset 0 0 30px rgba(245, 197, 66, .1); }
    .rcard.gen::after { content: "★ GENERAL"; position: absolute; top: -10px; left: 12px; box-shadow: 0 0 12px rgba(245, 197, 66, .5); font: 700 10px var(--f-display); letter-spacing: .16em; color: #1d1300; background: var(--gold); padding: 3px 8px; }
    .rcard.pick { outline: 1px dashed var(--cyan); outline-offset: 3px; }
    .rart { width: 88px; height: 88px; object-fit: contain; image-rendering: pixelated; background: #05071a; border: 1px solid var(--tint); }
    .rbody { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .rname { font: 700 17px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--a); line-height: 1.1; }
    .rcode { font: 12px var(--f-data); color: var(--dim); display: flex; align-items: center; gap: 6px; }
    .rcode canvas { width: 36px; height: auto; }
    .rlv, .rprice { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .rlv em, .rprice em { font: 600 10px var(--f-display); font-style: normal; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); min-width: 3.8em; }
    .rlv b, .rprice b { font: 600 13px var(--f-data); }
    .pips { display: inline-flex; gap: 2px; } .pips i { width: 6px; height: 6px; background: rgba(111, 211, 255, .15); } .pips i.on { background: var(--gold); box-shadow: 0 0 6px rgba(245, 197, 66, .6); }
    .ractions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
    .tog { position: relative; cursor: pointer; }
    .tog input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .tog span { display: inline-block; font: 600 11px var(--f-display); letter-spacing: .12em; text-transform: uppercase; padding: 5px 10px; border: 1px solid var(--edge); color: var(--dim); background: rgba(8, 14, 46, .6); transition: all .15s; }
    .tog:hover span { color: var(--ink); border-color: var(--edge-hi); }
    .tog input:checked + span { color: #1a0012; border-color: var(--a); background: var(--a); box-shadow: 0 0 12px rgba(255, 143, 216, .4); }
    .tog input:checked + span::before { content: "✓ "; }
    .tog.gold input:checked + span { color: #1d1300; border-color: var(--gold); background: var(--gold); box-shadow: 0 0 14px rgba(245, 197, 66, .4); }
    .tog.cyan input:checked + span { color: #00131d; border-color: var(--cyan); background: var(--cyan); }
    .tog input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }
    .genrow { margin-top: 14px; }

    /* production gallery and trade */
    .two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 18px; }
    .shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 8px; max-height: 520px; overflow: auto; padding-right: 4px; }
    .shopitem { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 10px 8px !important; text-transform: none !important; letter-spacing: .02em !important; }
    .shopitem img { width: 72px; height: 72px; object-fit: contain; image-rendering: pixelated; transition: transform .2s var(--ease); }
    .shopitem:hover:not(:disabled) img { transform: scale(1.08); }
    .shopitem span { display: flex; flex-direction: column; gap: 1px; }
    .shopitem b { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    .shopitem small { font: 11px var(--f-data); color: var(--gold); }
    select { font: 14px var(--f-body); background: rgba(8, 14, 46, .8); color: var(--ink); border: 1px solid var(--edge-hi); padding: 7px 10px; max-width: 100%; }
    .switch { display: inline-flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; }
    .switch input { position: absolute; opacity: 0; }
    .switch span { width: 42px; height: 22px; flex: none; border: 1px solid var(--edge-hi); background: rgba(8, 14, 46, .8); position: relative; transition: background .2s; }
    .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; background: var(--dim); transition: transform .2s var(--ease), background .2s; }
    .switch input:checked + span { background: rgba(245, 197, 66, .25); border-color: var(--gold); }
    .switch input:checked + span::after { transform: translateX(20px); background: var(--gold); box-shadow: 0 0 10px rgba(245, 197, 66, .6); }
    .switch input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }
    .tabs { margin-left: auto; gap: 8px; }
    @media (max-width: 820px) { .two { grid-template-columns: minmax(0, 1fr); } .hero { padding: 22px 18px; } }
    @media (prefers-reduced-motion: reduce) { .box, .two { animation: none; } .rcard, .shopitem img { transition: none; } }
  </style>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">EARTH LIGHT</span>
      <span class="sub">Expansion · Galt remnant</span>
    </div>
    <nav class="tabs"><a class="btn" href="game.html">Original game</a><a class="btn" href="editor.html">Map editor</a></nav>
  </header>
  <main id="app"><p id="status">Loading ROM…</p></main>
  <script type="module" src="js/expansion/intermission.js"></script>
</body>
</html>
