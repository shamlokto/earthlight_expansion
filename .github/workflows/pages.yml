# Publishes the game to GitHub Pages on every push to main (Settings → Pages → Source: GitHub Actions).
name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read      # deploy-pages looks the uploaded artifact up through the Actions API (2026-11-25: it found 0 without this)
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/build-site.sh . _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - run: sleep 20   # give the artifact a moment to be listed before deploying
      - id: deployment
        uses: actions/deploy-pages@v4
